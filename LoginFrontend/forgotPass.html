<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            width: 320px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .card h2 { text-align: center; margin-top: 0; }
        input {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #ffc107;
            color: #333;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 5px;
            font-weight: bold;
        }
        button:hover { background: #e0a800; }
        .switch-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
        .switch-link a { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Reset Password</h2>
        <input type="text" id="resetUsername" placeholder="Username">
        <input type="email" id="resetEmail" placeholder="Registered Email">
        <input type="password" id="resetNewPassword" placeholder="New Password">
        <input type="password" id="resetConfirmPassword" placeholder="Confirm New Password">
        <button onclick="resetPassword()">Reset Password</button>
        <div class="switch-link">
            <a href="login.html">Back to Login</a>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:5280/api";

        async function resetPassword() {
            const username = document.getElementById('resetUsername').value;
            const email = document.getElementById('resetEmail').value;
            const newPassword = document.getElementById('resetNewPassword').value;
            const confirmPassword = document.getElementById('resetConfirmPassword').value;

            if (!username || !email || !newPassword || !confirmPassword) {
                alert("Please fill in all fields.");
                return;
            }

            if (newPassword !== confirmPassword) {
                alert("Passwords do not match.");
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, newPassword })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(data.message);
                    window.location.href = "login.html";
                } else {
                    alert(data.message || "Reset failed.");
                }
            } catch (err) {
                alert("Something went wrong: " + err.message);
            }
        }
    </script>
</body>
</html>
