<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .navbar {
            width: 100%;
            background: #007bff;
            padding: 15px 30px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            color: white;
            margin: 0;
        }

        .navbar button {
            padding: 8px 16px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .navbar button:hover {
            background: #a71d2a;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            width: 360px;
            margin-top: 40px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .card h1 {
            margin-top: 0;
            color: #333;
        }

        .info-row {
            text-align: left;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .info-row span {
            font-weight: bold;
            color: #555;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>My Dashboard</h2>
        <button onclick="logout()">Log Out</button>
    </div>

    <div class="card">
        <h1 id="welcomeMessage">Loading...</h1>
        <div class="info-row"><span>Username:</span> <span id="dashUsername"></span></div>
        <div class="info-row"><span>Email:</span> <span id="dashEmail"></span></div>
        <div class="info-row"><span>User ID:</span> <span id="dashUserId"></span></div>
    </div>

    <script>
        const API_URL = "http://localhost:5280/api";

        // 1. GUARD: redirect to login if no token exists
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = "login.html";
        }

        // 2. Fetch and display the logged-in user's profile
        async function loadDashboard() {
            try {
                const response = await fetch(`${API_URL}/protected/profile`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('welcomeMessage').innerText = `Welcome, ${data.username}!`;
                    document.getElementById('dashUsername').innerText = data.username;
                    document.getElementById('dashEmail').innerText = data.email;
                    document.getElementById('dashUserId').innerText = data.userId;
                } else {
                    // Token invalid or expired — force back to login
                    localStorage.removeItem('token');
                    window.location.href = "login.html";
                }
            } catch (err) {
                document.getElementById('welcomeMessage').innerText = "Error loading dashboard.";
                console.error(err);
            }
        }

        // 3. Logout
        function logout() {
            localStorage.removeItem('token');
            window.location.href = "login.html";
        }

        loadDashboard();
    </script>
</body>

</html>
